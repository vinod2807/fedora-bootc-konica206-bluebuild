# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# BlueBuild port of vinod2807/fedora-bootc-konica206 -- KDE Plasma (Kinoite) edition.
# Printer/system side tracks upstream (tools/import-from-source.sh); the desktop
# itself is Fedora Kinoite's Plasma, so no compositor/panel/theme is shipped here.
# Desktop apps that used to be Flatpaks are now native RPMs, including the
# vendor packages installed in the second dnf module.
---
name: fedora-bootc-konica206-bluebuild
description: Fedora bootc - KDE Plasma (Kinoite) + Konica Minolta bizhub 206 (PAPPL + native C11 encoder), legacy-BIOS friendly
base-image: ghcr.io/blue-build/base-images/fedora-kinoite
# Follows the Fedora release train like the original (BASE_IMAGE=:latest).
# To freeze, set e.g. "44" here AND change `from:` of the stage below.
image-version: latest
platforms:
  - linux/amd64

labels:
  org.opencontainers.image.title: "Fedora bootc - Kinoite/Plasma + Konica bizhub 206 (BlueBuild)"
  org.opencontainers.image.licenses: "NOASSERTION"
  # Printer source commit SHAs are recorded inside the image instead:
  #   /usr/share/konica206/{app,native,retrofit}-commit

stages:
  # Port of the `printer-builder` stage of the original Containerfile.
  - name: konica-build
    from: quay.io/fedora/fedora:latest
    modules:
      - type: files
        files:
          - source: stage-inputs
            destination: /usr/src/stage-inputs
      - type: script
        scripts:
          - build-konica-stage.sh

modules:
  # Weekly rebuilds pick up current Fedora updates (original: dnf upgrade --refresh).
  - type: script
    snippets:
      - "dnf -y upgrade --refresh"

  # RPM Fusion adds proprietary media codecs (H.264/H.265/AAC, DVD/Blu-ray,
  # GStreamer bad/ugly). Brave's repo supplies the Brave RPM. Repos are removed
  # after this module; packages stay in the image.
  - type: dnf
    repos:
      cleanup: true
      nonfree: rpmfusion
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
      keys:
        - https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
    install:
      install-weak-deps: false
      skip-unavailable: true
      packages:
        # --- former Flatpaks, now native RPMs ---
        - repo: brave-browser
          packages:
            - brave-browser
        - bottles
        - gnome-calculator
        - gthumb
        - gpodder
        - libreoffice
        - libreoffice-langpack-en
        - firefox
        - mpv
        - qbittorrent
        - vlc
        - pdfarranger # PdfCraft replacement
        - calibre # Koodo Reader replacement
        - flameshot # Impression replacement (Plasma also ships Spectacle)
        - zoitechat
        # --- proprietary media codecs (RPM Fusion) ---
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-libav
        - libdvdcss
        - libaacs
        - libbdplus
        - rpmfusion-free-appstream-data
        - rpmfusion-nonfree-appstream-data
        # --- printing / scanning / sharing ---
        - avahi
        - cups
        - cups-filters
        - ghostscript
        - system-config-printer
        - legacy-printer-app
        - pappl
        - libusb1
        - sane-airscan
        - simple-scan
        - samba
        - samba-client
        # --- bootc / flatpak / tools ---
        - zram-generator
        - flatpak
        - zip
        - usbutils
        - policycoreutils-python-utils
        - qt5-qtbase-gui # Epson Printer Utility
        - gh
        - fastfetch

  # Vendor RPMs not in Fedora/RPM Fusion. The script resolves the newest
  # upstream release on every build, so weekly rebuilds + the host's
  # bootc-upgrade.timer keep these apps current too. XnView/OnlyOffice publish
  # moving "latest RPM" URLs; NAPS2/ZapFast versions come from the GitHub API.
  - type: script
    scripts:
      - install-vendor-apps.sh

  # Static assets at their final absolute paths (see tools/import-from-source.sh).
  - type: files
    files:
      - source: system
        destination: /
      # /usr/local/bin comes from the konica-build stage output (COPY --link
      # replaces that directory), including konica-scan.
      - source: local-rpms
        destination: /usr/share/konica206-build/local-rpms

  # Vendored Epson Printer Utility + sane-ar206 RPMs.
  - type: script
    scripts:
      - vendor-rpms.sh

  # Printer binaries + retrofit assets assembled by the builder stage (one COPY, like the original).
  - type: copy
    from: konica-build
    src: /out/
    dest: /

  # konica user, vendor-data symlink, generated PPD, chmods, cupsd sharing, Flathub remote, GRUB timeout...
  - type: script
    scripts:
      - konica-final.sh

  - type: systemd
    system:
      enabled:
        - bootc-upgrade.timer
        - flatpak-update.timer
        - NetworkManager.service
        - konica206-native.service
        - konica206-vendor-data.service
        - konica206-queue.service
        - legacy-printer-app.service
        - konica206uri-queue.service
        - konica-cups-watch.service
        - konica-cups-watch.timer
        - epson-l3260-queue.service
        - konica206-classic-queue.service
        - samba-setup.service
        - avahi-daemon.service
        - smb.service
        - nmb.service
      masked:
        # would pull AND reboot unattended; bootc-upgrade.timer only stages.
        - bootc-fetch-apply-updates.timer
        # Ironlake BIOS exposes no S3 and s2idle hangs.
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target
        - suspend-then-hibernate.target
    user:
      enabled:
        - flatpak-update.timer

  - type: signing

  # No rpm-ostree in the final image (removes it if the base or BlueBuild brought it, fails if it stays).
  - type: script
    scripts:
      - no-rpm-ostree.sh

  # bootc's own sanity checks; keep last. If BlueBuild's additions make this
  # fail, read the lint message before relaxing anything.
  - type: script
    snippets:
      - "bootc container lint"
