name: bluebuild
on:
  schedule:
    - cron: "30 21 * * 6" # Sunday 03:00 IST / Saturday 21:30 UTC, like the original
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bluebuild:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # signing, as in the official template
    steps:
      # Pin to a full commit SHA once the first build works (the original repo does).
      - uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          # Leave use_cache off: the stage and scripts fetch moving upstream
          # sources (printer repos, NAPS2/ZapFast), which a layer cache would hide.
          # Rechunk like the original repo's chunkah pipeline so bootc upgrade only
          # downloads the layers whose content changed. The action passes --max-layers
          # to chunkah and signs the rechunked result.
          chunkah: true
          max_layers: 64
