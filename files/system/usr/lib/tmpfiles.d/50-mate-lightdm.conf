# LightDM runtime directories. bootc images carry no SELinux xattrs, so the
# greeter's directories can end up labelled var_t and make it exit before the
# session starts. Recreate and relabel them at boot, before lightdm.service.
z /var/cache
d /var/cache/lightdm 0755 lightdm lightdm -
Z /var/cache/lightdm
d /var/lib/lightdm 0700 lightdm lightdm -
d /var/lib/lightdm-data 0755 lightdm lightdm -
Z /var/lib/lightdm
Z /var/lib/lightdm-data
