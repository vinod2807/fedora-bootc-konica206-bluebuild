# MATE on Xorg via LightDM. This drop-in is read after the packaged
# /etc/lightdm/lightdm.conf and wins over its defaults.
[Seat:*]
greeter-session=lightdm-gtk-greeter
user-session=mate
# Autologin as the user created by Anaconda (same policy as the old greetd
# image); the GTK greeter is still available after logout or on failure.
autologin-user=vinod
autologin-user-timeout=0
autologin-session=mate
