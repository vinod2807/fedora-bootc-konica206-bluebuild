[General]
# Pin the Wayland session to Miriway. Fedora's packaged default already says
# miriway; this file is the system-wide override read by startlxqtwayland
# (XDG_CONFIG_DIRS includes /etc) so a base-image change cannot silently flip
# the compositor back to labwc, which this image no longer ships.
compositor=miriway
leave_confirmation=true

[Environment]
GTK_CSD=0
GTK_OVERLAY_SCROLLING=0
MIRIWAY_SYSTEM_LOCALE1_KEYMAP=1

[Mouse]
cursor_size=24
cursor_theme=Adwaita
acc_factor=20
acc_threshold=10
left_handed=false

[Keyboard]
delay=500
interval=30
beep=false

[Font]
antialias=true
hinting=true
dpi=96
