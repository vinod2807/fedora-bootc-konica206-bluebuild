# LXQt/Qt appearance for the LXQt-on-Miriway session.
#
# The GTK/dconf dark defaults (etc/gtk-3.0, etc/gtk-4.0, etc/dconf) are not
# read by Qt. Qt gets its palette from lxqt-qtplugin (recipe) using the
# [Palette] colors below, and LXQt's own widget/panel theme from [General].
# Without lxqt-qtplugin, QT_QPA_PLATFORMTHEME=lxqt silently falls back to the
# light Fusion palette, which made the whole session look white.
[General]
theme=dark
icon_theme=breeze-dark
palette_override=true
single_click_activate=false
tool_button_style=ToolButtonTextBesideIcon

[Qt]
style=Fusion
font="Sans,11,-1,5,50,0,0,0,0,0"
doubleClickInterval=400
wheelScrollLines=3

[Palette]
window_color=#2b2b2b
window_text_color=#e6e6e6
base_color=#1e1e1e
text_color=#e6e6e6
highlight_color=#3daee9
highlighted_text_color=#ffffff
link_color=#3daee9
link_visited_color=#9b59b6
tooltip_base_color=#2b2b2b
tooltip_text_color=#e6e6e6
