# Portal routing for the LXQt session (XDG_CURRENT_DESKTOP=LXQt:miriway:mir).
# GTK portal: file chooser, print dialog (printing from GTK/Flatpak apps),
# settings (dark mode), open-URI, app chooser. wlr portal: screenshots and
# screen sharing (Miriway is a Wayland compositor with screencopy support).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
