# Portal routing for the labwc session (XDG_CURRENT_DESKTOP=labwc).
# GTK portal: file chooser, print dialog (printing from GTK/Flatpak apps), settings (dark mode),
# open-URI, app chooser. wlr portal: screenshots and screen sharing (labwc is wlroots-based).
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
