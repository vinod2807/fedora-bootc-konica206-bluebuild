[terminal]
# greetd takes VT1; getty@tty1 is conflicted out by the packaged unit.
# Ctrl+Alt+F2 still gives a text login for troubleshooting.
vt = 1

[default_session]
# Fallback greeter (after logout, or if autologin fails).
# Fedora's startlxqtwayland reads /etc/xdg/lxqt/session.conf and launches
# LXQt on Miriway (via lxqt-miriway-session).
command = "tuigreet --time --remember --cmd /usr/bin/startlxqtwayland"
user = "greetd"

[initial_session]
# Autologin as vinod on first boot since boot.
command = "/usr/bin/startlxqtwayland"
user = "vinod"
